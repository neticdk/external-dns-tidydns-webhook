---
name: CI

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  test:
    name: Go Continuous Integration
    uses: neticdk/shared-github-actions/.github/workflows/go-ci.yaml@5a8088d825acc21e9ba96ffe04389e96301f60b7 # v0.8.1
    secrets: inherit
