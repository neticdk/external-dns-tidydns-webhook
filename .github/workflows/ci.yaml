---
name: CI

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

jobs:
  test:
    name: Go Continuous Integration
    uses: neticdk/shared-github-actions/.github/workflows/go-ci.yaml@a896dd9c1eb45e54c30eb3f256e6f269869e98e1 # v0.4.2
    secrets: inherit
