---
name: CD

on:
  push:
    tags:
      - v*

# id-token and attestations let go-cd.yaml in neticdk/shared-github-actions
# sign build provenance. Only its provenance jobs receive them.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Go Continuous Delivery
    uses: neticdk/shared-github-actions/.github/workflows/go-cd.yaml@97e6b6e38dc290e4b2ca8982fb7c496db6584c3d # v0.9.1
    secrets: inherit
