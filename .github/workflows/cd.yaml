---
name: CD

on:
  push:
    tags:
      - v*

# id-token and attestations let go-cd.yaml in neticdk/shared-github-actions
# sign build provenance. Only its provenance jobs receive them.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Go Continuous Delivery
    uses: neticdk/shared-github-actions/.github/workflows/go-cd.yaml@0f94f62339cec974c8d6febed7b49165d62d0719 # v0.9.0
    secrets: inherit
