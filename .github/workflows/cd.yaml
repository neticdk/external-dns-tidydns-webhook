---
name: CD

on:
  push:
    tags:
      - v*

# id-token and attestations let go-cd.yaml in neticdk/shared-github-actions
# sign build provenance. Only its provenance jobs receive them.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Go Continuous Delivery
    uses: neticdk/shared-github-actions/.github/workflows/go-cd.yaml@714a9565dec5f76ff9d578c0fac0c8f9db5e77de # v1.2.0
    secrets: inherit
